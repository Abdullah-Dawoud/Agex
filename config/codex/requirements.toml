# DAWOUD-owned managed hooks.
# Installed to %ProgramData%\\OpenAI\\Codex\\requirements.toml by setup.ps1.
# Managed status removes repeated review for this exact canonical hook while
# leaving unknown project/user/plugin hooks subject to normal Codex review.

[features]
hooks = true

[hooks]
windows_managed_dir = 'C:\Users\isc\OneDrive\Documents\ChatGPT\setup\scripts'

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = 'command'
command = 'pwsh.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Users\isc\OneDrive\Documents\ChatGPT\setup\scripts\dawoud-interactive-hook.ps1"'
command_windows = 'pwsh.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Users\isc\OneDrive\Documents\ChatGPT\setup\scripts\dawoud-interactive-hook.ps1"'
timeout = 600
statusMessage = 'DAWOUD routing user task'

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = 'command'
command = 'pwsh.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Users\isc\OneDrive\Documents\ChatGPT\setup\scripts\dawoud-interactive-hook.ps1"'
command_windows = 'pwsh.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Users\isc\OneDrive\Documents\ChatGPT\setup\scripts\dawoud-interactive-hook.ps1"'
timeout = 30
statusMessage = 'DAWOUD execution report'
