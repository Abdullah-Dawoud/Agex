name: Release

# Builds and smoke-tests the release packages on every push to main, and
# publishes an AGEX release when a version tag (v2.0.0) is pushed.
# Each platform is built, tested and signed on its own runner. Signing is
# optional: without the secrets below the packages are built unsigned and the
# release notes say so.
#
# Optional secrets:
#   WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD      Authenticode signing (Windows)
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD,
#   MACOS_SIGN_IDENTITY                                  Developer ID signing (macOS)
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD          notarization (macOS)
#   AGEX_RELEASE_SIGNING_KEY                             ECDSA key that signs SHA256SUMS.txt
#
# Releases are published as pre-releases unless the repository variable
# AGEX_STABLE_RELEASE is 'true' (set it only after macOS and Linux runtime tests).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

# No build telemetry from .NET or Avalonia tooling.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            runtimes: win-x64,win-arm64
          - os: macos-latest
            runtimes: osx-arm64,osx-x64
          - os: ubuntu-latest
            runtimes: linux-x64,linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      HAS_MAC_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "VERSION ($version) does not match tag ${{ github.ref_name }}" }
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$RUNNER_TEMP/agex.keychain"
          security set-keychain-settings "$RUNNER_TEMP/agex.keychain"
          security unlock-keychain -p actions "$RUNNER_TEMP/agex.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/agex.keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$RUNNER_TEMP/agex.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/agex.keychain"
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build, test and package
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # On failure, repeat the end of the output as an annotation so it is visible without log access.
          $failed = $false
          try { ./tools/build-release.ps1 -Runtime ("${{ matrix.runtimes }}" -split ',') *>&1 | Tee-Object -FilePath build.log }
          catch { $_ | Out-String | Add-Content build.log; $failed = $true }
          if ($failed -or -not $?) {
            $tail = (Get-Content build.log -Tail 40) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error title=build-release failed::$tail"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg

  # Runs the packaged 'agex' command (not the desktop window) on a runner of the
  # package's own OS and processor. This proves the package starts there; it is
  # not a GUI test.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, artifact: packages-Windows, package: win-x64.zip, experimental: false }
          - { os: windows-11-arm, artifact: packages-Windows, package: win-arm64.zip, experimental: true }
          - { os: macos-latest, artifact: packages-macOS, package: osx-arm64.zip, experimental: false }
          - { os: macos-15-intel, artifact: packages-macOS, package: osx-x64.zip, experimental: true }
          - { os: ubuntu-latest, artifact: packages-Linux, package: linux-x64.tar.gz, experimental: false }
          - { os: ubuntu-24.04-arm, artifact: packages-Linux, package: linux-arm64.tar.gz, experimental: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Extract and run agex
        shell: bash
        env:
          AGEX_HOME: ${{ runner.temp }}/agex-home
        run: |
          # Each check repeats its output as an annotation on failure (logs need sign-in to read).
          # GitHub runs bash with -e; turn it off so check() can report before exiting.
          set +e
          check() {
            "$@" > out.txt 2>&1; code=$?; cat out.txt
            if [ $code -ne 0 ]; then
              msg=$(tail -n 30 out.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$1 $2 failed (exit $code)::$msg"; exit 1
            fi
          }
          package=$(ls dist/agex-*-${{ matrix.package }} 2>/dev/null)
          [ -n "$package" ] || { echo "::error title=package missing::$(ls -R dist | head -n 20 | awk '{printf "%s%%0A", $0}')"; exit 1; }
          mkdir -p pkg
          case "$package" in
            *.tar.gz) check tar -xzf "$package" -C pkg; bin=pkg/agex/agex; desktop=pkg/agex/AgexDesktop ;;
            *osx-*) check ditto -x -k "$package" pkg; bin=pkg/AGEX.app/Contents/MacOS/agex; desktop=pkg/AGEX.app/Contents/MacOS/AgexDesktop
                    check codesign --verify --verbose=2 pkg/AGEX.app ;;
            *) check unzip -q "$package" -d pkg; bin=pkg/agex.exe; desktop=pkg/AgexDesktop.exe ;;
          esac
          check test -f "$desktop"
          check "$bin" version
          check "$bin" doctor
          check "$bin" skills catalog
          echo "Desktop GUI was not started (no GUI test in CI)."

  publish:
    # Experimental smoke jobs (continue-on-error) never block publishing.
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and signature
        env:
          AGEX_RELEASE_SIGNING_KEY: ${{ secrets.AGEX_RELEASE_SIGNING_KEY }}
        run: |
          cp install/agex-install.ps1 install/agex-install.sh src/Agex.Core/Skills/skills-catalog.json dist/
          notes="docs/release-notes/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then cp "$notes" dist/release-notes.md; else cp CHANGELOG.md dist/release-notes.md; fi
          cd dist
          sha256sum * | sort -k 2 > SHA256SUMS.txt
          cd ..
          if [ -n "$AGEX_RELEASE_SIGNING_KEY" ]; then dotnet run tools/sign-release.cs -- sign dist/SHA256SUMS.txt; else echo "Release checksums are not signed (no AGEX_RELEASE_SIGNING_KEY)."; fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ vars.AGEX_STABLE_RELEASE }}
        run: |
          flag="--prerelease"
          if [ "$STABLE" = "true" ]; then flag=""; fi
          gh release create "${{ github.ref_name }}" dist/* --title "AGEX ${{ github.ref_name }}" --notes-file dist/release-notes.md $flag
