name: Release

# Publishes an AGEX release when a version tag (v1.2.3) is pushed.
# The build uses only tools that ship with Windows (.NET Framework csc,
# Windows PowerShell), the same as a local build.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "VERSION ($version) does not match tag ${{ github.ref_name }}" }
      - name: Engine tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\agex-engine.tests.ps1 -SkipSlow
      - name: Build release
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-release.ps1
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: gh release create "${{ github.ref_name }}" dist\agex-*-win.zip dist\agex-install.ps1 dist\SHA256SUMS.txt --title "AGEX ${{ github.ref_name }}" --notes-file CHANGELOG.md
