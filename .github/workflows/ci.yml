name: CI

# Builds AGEX and runs the tests on Windows, macOS and Linux for every push and
# pull request. The tests use fake agents; no real agent or account is needed.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# No build telemetry from .NET or Avalonia tooling.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Agex.slnx -c Release
      - name: Test
        run: dotnet test tests/Agex.Tests -c Release --no-build
      - name: Installer syntax
        if: runner.os != 'Windows'
        run: sh -n install/agex-install.sh && sh -n tools/sign-macos.sh

  # Runs the README one-command install against the newest published GitHub
  # release on each OS and processor, in a throw-away home folder. Checks
  # release discovery, package selection, checksum and that 'agex' starts.
  install:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: One-command install (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          export HOME="$RUNNER_TEMP/home" AGEX_HOME="$RUNNER_TEMP/agex-home"
          mkdir -p "$HOME"
          curl -fsSL https://raw.githubusercontent.com/Abdullah-Dawoud/Agex/main/install/agex-install.sh | sh -s -- --no-launch
          "$HOME/.local/bin/agex" version
      - name: One-command install (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:AGEX_HOME = "$env:RUNNER_TEMP\agex-home"
          irm https://raw.githubusercontent.com/Abdullah-Dawoud/Agex/main/install/agex-install.ps1 -OutFile "$env:TEMP\agex-install.ps1"
          powershell -ExecutionPolicy Bypass -File "$env:TEMP\agex-install.ps1" -InstallDir "$env:RUNNER_TEMP\AGEX" -NoPath -NoShortcut -NoLaunch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\AGEX\agex.exe" version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
