name: CI

# Builds AGEX and runs the tests on Windows, macOS and Linux for every push and
# pull request. The tests use fake agents; no real agent or account is needed.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# No build telemetry from .NET or Avalonia tooling.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Agex.slnx -c Release
      - name: Test
        run: dotnet test tests/Agex.Tests -c Release --no-build
      - name: Installer syntax
        if: runner.os != 'Windows'
        run: sh -n install/agex-install.sh && sh -n tools/sign-macos.sh
